name: CI & Publish

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup supported Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun ci

      - name: Type-check
        run: bun run check

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          echo "### Vitest Test & Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```txt' >> "$GITHUB_STEP_SUMMARY"
          bun run test:coverage | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Kill every mutant
        run: bun run test:mutation

      - name: Run 20000 reproducible fuzz cases
        run: bun run test:fuzz:contract

      - name: Preserve minimized fuzz failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-failures
          path: fuzz-failure-*.json
          if-no-files-found: ignore

      - name: Build package
        run: bun run build

      - name: Enforce size budget
        run: bun run size

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Exercise built ESM and browser-worker bundle
        run: bun run test:smoke

      - name: Verify release tag and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(bun -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v${package_version}." >&2
            exit 1
          fi
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /dev/null

  publish:
    name: Publish to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `contents: write` cuts the GitHub Release; `id-token` is npm trusted publishing.
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun ci

      - name: Build package
        run: bun run build

      - name: Enforce size budget
        run: bun run size

      - name: Extract release notes
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish to npm
        run: npm publish --access public

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
